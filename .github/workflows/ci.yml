name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: IITC artifact is in sync with ingestCore + template
        run: npm run check:iitc
      - name: Build static site
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
